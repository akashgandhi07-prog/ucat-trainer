name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run verify:sjt
      - run: npm run verify:sjt-review
      - run: npm run verify:progress
      - run: npm run verify:sjt-recommendation
      - run: npm run verify:sjt-recovery
      - run: npm run build
      - run: npm run check:bundle
      - run: npm run verify:seo
